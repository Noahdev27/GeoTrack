name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  android-apk:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Le SDK Android est préinstallé sur les runners ubuntu-latest (ANDROID_HOME).
      - run: npm ci
      - name: Build web + cap sync android
        run: npm run cap:sync
      # assembleRelease (non signé sans secrets) valide aussi la configuration release.
      - name: Build APK debug + release
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: geotrack-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
